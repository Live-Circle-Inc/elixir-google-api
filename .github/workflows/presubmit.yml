name: Presubmit

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    strategy:
      matrix:
        include:
          # Primary versions, must match .tool-versions.
          - elixir: "1.20.3-otp-29"
            otp: "29.0.5"
          # Previous minor, kept for backwards compatibility.
          - elixir: "1.19.5-otp-28"
            otp: "28.5.0.5"
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Elixir ${{ matrix.elixir }} on OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "${{ matrix.otp }}"
          elixir-version: "${{ matrix.elixir }}"
          version-type: strict
      - name: Run presubmits
        run: mix do deps.get, presubmit --pr ${{ github.event.pull_request.number }}
  required-checks:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Required checks collector
        run: 'test "${NEEDS_TESTS_RESULT}" = "success"'
        env:
          NEEDS_TESTS_RESULT: ${{ needs.tests.result }}
